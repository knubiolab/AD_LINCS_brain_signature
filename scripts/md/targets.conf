# ---------------------------------------------------------------------------
# Target definitions for the molecular dynamics analyses
#
# One block per simulated system. Residue numbers follow the numbering of the
# PDB entry listed in `pdb`, which is the numbering used by the .tpr files.
#
# Fields
#   dir       working directory of the system (relative to MD_ROOT)
#   pdb       PDB entry the receptor was taken from
#   label     human-readable label used in figures and summary tables
#   ligres    residue name of the ligand in the topology (SwissParam default: UNL)
#   keyres    residues used for the "hydrogen bonds to key residues" analysis;
#             these are the previously reported interaction residues for each
#             target (see Methods, "Molecular docking")
#   extra     optional per-target selections, evaluated by 04_site_contacts.sh
#
# Sourced by the 0*.sh scripts; shell syntax, one assignment per line.
# ---------------------------------------------------------------------------

TARGETS=(bche_motesanib bche_reference pparg_motesanib pparg_reference \
         gr_motesanib gr_reference vdr_motesanib vdr_calcitriol \
         vdr_paricalcitol hnf4a_motesanib)

# --- butyrylcholinesterase -------------------------------------------------
bche_motesanib_dir="BCHE_motesanib";      bche_motesanib_pdb="4TPK"
bche_motesanib_label="BChE - motesanib";  bche_motesanib_ligres="UNL"
bche_reference_dir="BCHE_reference";      bche_reference_pdb="4TPK"
bche_reference_label="BChE - reference ligand"; bche_reference_ligres="UNL"
# Trp82 (choline-binding), oxyanion hole (Gly116/Gly117), catalytic Ser198,
# acyl pocket (Val288), gorge-lining aromatics (Trp231/Phe329), PAS (Asp70/Tyr332)
BCHE_KEYRES="82 116 117 198 288 231 329 70 332"
# catalytic anionic site (catalytic triad) and peripheral anionic site
BCHE_CAS="198 325 438"
BCHE_PAS="70 332"
# Trp82 indole ring, for the pi-stacking distance
BCHE_RING_ATOMS="CG CD1 CD2 NE1 CE2 CE3 CZ2 CZ3 CH2"

# --- PPAR gamma ------------------------------------------------------------
pparg_motesanib_dir="PPARG_motesanib";    pparg_motesanib_pdb="8REJ"
pparg_motesanib_label="PPARg - motesanib"; pparg_motesanib_ligres="UNL"
pparg_reference_dir="PPARG_reference";    pparg_reference_pdb="8REJ"
pparg_reference_label="PPARg - reference ligand"; pparg_reference_ligres="UNL"
# Ser289/His323/His449/Tyr473 (AF-2 network), Cys285, Arg288, Tyr327, Lys367,
# Ser342/Arg343 (beta-sheet region)
PPARG_KEYRES="285 288 289 323 327 342 343 367 449 473"

# --- glucocorticoid receptor ----------------------------------------------
gr_motesanib_dir="GR_motesanib";          gr_motesanib_pdb="3E7C"
gr_motesanib_label="GR - motesanib";      gr_motesanib_ligres="UNL"
gr_reference_dir="GR_reference";          gr_reference_pdb="3E7C"
gr_reference_label="GR - reference ligand"; gr_reference_ligres="UNL"
GR_KEYRES="564 570 611 629 642"

# --- vitamin D receptor (negative control) --------------------------------
vdr_motesanib_dir="VDR_motesanib";        vdr_motesanib_pdb="7QPP"
vdr_motesanib_label="VDR - motesanib";    vdr_motesanib_ligres="UNL"
vdr_calcitriol_dir="VDR_calcitriol";      vdr_calcitriol_pdb="7QPP"
vdr_calcitriol_label="VDR - calcitriol";  vdr_calcitriol_ligres="UNL"
vdr_paricalcitol_dir="VDR_paricalcitol";  vdr_paricalcitol_pdb="7QPP"
vdr_paricalcitol_label="VDR - paricalcitol"; vdr_paricalcitol_ligres="UNL"
VDR_KEYRES="143 237 274 278 305 397"

# --- HNF4 alpha (negative control) ----------------------------------------
hnf4a_motesanib_dir="HNF4A_motesanib";    hnf4a_motesanib_pdb="9IBR"
hnf4a_motesanib_label="HNF4a - motesanib"; hnf4a_motesanib_ligres="UNL"
HNF4A_KEYRES="181 185 226 227"

# --- analysis window -------------------------------------------------------
# Equilibrated phase used for every equilibrium analysis (ns).
WINDOW_BEGIN_NS=200
WINDOW_END_NS=300
# gmx cluster settings (GROMOS algorithm)
CLUSTER_CUTOFF_NM=0.10
